name: sky-cloak/skycloak
resources:
    skycloak_application:
        subCategory: ""
        description: An OIDC/SAML client (application) in a Skycloak realm.
        name: skycloak_application
        title: skycloak_application Resource - skycloak
        examples:
            - name: web
              manifest: |-
                {
                  "client_id": "web-app",
                  "cluster_id": "${skycloak_cluster.production.id}",
                  "name": "Web App",
                  "pkce_required": true,
                  "protocol": "openid-connect",
                  "realm_name": "${skycloak_realm.app.name}",
                  "redirect_uris": [
                    "https://app.example.com/callback"
                  ],
                  "type": "confidential"
                }
              references:
                cluster_id: skycloak_cluster.production.id
                realm_name: skycloak_realm.app.name
        argumentDocs:
            client_id: (String) OAuth client ID (unique within the realm). Immutable.
            client_secret: (String, Sensitive) Client secret (confidential clients). Returned on create; use a rotate operation to change it.
            cluster_id: (String) Cluster ID. Immutable.
            consent_required: (Boolean) Require user consent. Defaults to false.
            created_at: (String) Creation timestamp.
            description: (String) Description.
            grant_types: (List of String) OAuth grant types enabled for the client.
            id: (String) Composite ID cluster_id/realm_name/client_id.
            name: (String) Display name.
            pkce_required: (Boolean) Require PKCE. Defaults to false.
            protocol: '(String) Protocol: openid-connect or saml. Immutable.'
            realm_name: (String) Realm name. Immutable.
            redirect_uris: (List of String) Allowed redirect URIs.
            service_account_enabled: (Boolean) Whether a service account (client credentials) is enabled. Read-only.
            status: (String) Status (active/inactive).
            type: '(String) Client type: confidential or public. Immutable.'
            updated_at: (String) Last update timestamp.
        importStatements: []
    skycloak_application_role_assignment:
        subCategory: ""
        description: Grants a role to an application's service account. One resource per (client, role) edge.
        name: skycloak_application_role_assignment
        title: skycloak_application_role_assignment Resource - skycloak
        examples:
            - name: web_manage_users
              manifest: |-
                {
                  "client_id": "${skycloak_application.web.client_id}",
                  "cluster_id": "${skycloak_cluster.production.id}",
                  "realm_name": "${skycloak_realm.app.name}",
                  "role_client_id": "realm-management",
                  "role_name": "manage-users"
                }
              references:
                client_id: skycloak_application.web.client_id
                cluster_id: skycloak_cluster.production.id
                realm_name: skycloak_realm.app.name
        argumentDocs:
            client_id: (String) Application client ID receiving the role. Immutable.
            cluster_id: (String) Cluster ID. Immutable.
            id: (String) The ID of this resource.
            realm_name: (String) Realm name. Immutable.
            role_client_id: (String) Client ID owning the role, for a client role. Omit for a realm role. Immutable.
            role_name: (String) Role name to assign. Immutable.
        importStatements: []
    skycloak_application_secret:
        subCategory: ""
        description: Rotates an application's client secret. The secret is regenerated whenever this resource is created or rotate_when changes.
        name: skycloak_application_secret
        title: skycloak_application_secret Resource - skycloak
        examples:
            - name: web
              manifest: |-
                {
                  "client_id": "${skycloak_application.web.client_id}",
                  "cluster_id": "${skycloak_cluster.production.id}",
                  "realm_name": "${skycloak_realm.app.name}",
                  "rotate_when": {
                    "rotated_on": "2026-01-01"
                  }
                }
              references:
                client_id: skycloak_application.web.client_id
                cluster_id: skycloak_cluster.production.id
                realm_name: skycloak_realm.app.name
        argumentDocs:
            client_id: (String) Application client ID. Immutable.
            client_secret: (String, Sensitive) The current (rotated) client secret.
            cluster_id: (String) Cluster ID. Immutable.
            id: (String) Composite ID cluster_id/realm_name/client_id.
            realm_name: (String) Realm name. Immutable.
            rotate_when: (Map of String) Arbitrary key/value map; changing any value forces a new secret to be generated.
        importStatements: []
    skycloak_captcha_domain:
        subCategory: ""
        description: A hostname registered for CAPTCHA protection on a cluster. The number of registrable hostnames is capped per cluster; the API rejects additions beyond the cap.
        name: skycloak_captcha_domain
        title: skycloak_captcha_domain Resource - skycloak
        examples:
            - name: login
              manifest: |-
                {
                  "cluster_id": "${skycloak_cluster.production.id}",
                  "hostname": "login.example.com"
                }
              references:
                cluster_id: skycloak_cluster.production.id
        argumentDocs:
            cluster_id: (String) Cluster ID. Immutable.
            created_at: (String) Registration timestamp.
            hostname: (String) Hostname to protect; must be one of the cluster's verified custom domains. Immutable.
            id: (String) Composite ID cluster_id/hostname.
        importStatements: []
    skycloak_client_theme_assignment:
        subCategory: ""
        description: Per-client login-theme override. Overrides the realm default for a single OIDC/SAML client.
        name: skycloak_client_theme_assignment
        title: skycloak_client_theme_assignment Resource - skycloak
        examples:
            - name: web
              manifest: |-
                {
                  "client_id": "${skycloak_application.web.client_id}",
                  "cluster_id": "${skycloak_cluster.production.id}",
                  "login": "${local.corporate_theme}",
                  "realm_name": "${skycloak_realm.app.name}"
                }
              references:
                client_id: skycloak_application.web.client_id
                cluster_id: skycloak_cluster.production.id
                login: local.corporate_theme
                realm_name: skycloak_realm.app.name
        argumentDocs:
            client_id: (String) OIDC/SAML client ID. Immutable.
            cluster_id: (String) Cluster ID. Immutable.
            id: (String) Composite ID cluster_id/realm_name/client_id/theme.
            login: (String) Custom theme ID to activate for this client's login page. Omit to use the realm default.
            realm_name: (String) Realm name. Immutable.
        importStatements: []
    skycloak_cluster:
        subCategory: ""
        description: A Skycloak managed Keycloak cluster.
        name: skycloak_cluster
        title: skycloak_cluster Resource - skycloak
        examples:
            - name: production
              manifest: |-
                {
                  "location": "eu",
                  "name": "production",
                  "size": "small",
                  "type": "keycloak",
                  "version": "26.1"
                }
        argumentDocs:
            auto_upgrade_enabled: (Boolean) Enable automatic patch upgrades, applied inside the cluster's maintenance window. Defaults to false.
            id: (String) Cluster ID (UUID).
            location: (String) Region (us, ca, eu, au). Immutable — changing it replaces the cluster.
            name: (String) Human-readable cluster name.
            size: (String) Instance size (small, medium, large).
            status: (String) Lifecycle status (provisioning, available, ...).
            type: (String) Cluster type (keycloak or tidecloak). Immutable — changing it replaces the cluster.
            url: (String) Cluster base URL once available.
            version: (String) Keycloak version, e.g. 26.1.
        importStatements: []
    skycloak_cluster_extension:
        subCategory: ""
        description: Installs a marketplace extension on a cluster. Installation is asynchronous; the status reflects provisioning progress. Changing extension_id or parameters reinstalls the extension.
        name: skycloak_cluster_extension
        title: skycloak_cluster_extension Resource - skycloak
        examples:
            - name: magic_link
              manifest: |-
                {
                  "cluster_id": "${skycloak_cluster.production.id}",
                  "extension_id": "${local.magic_link_id}",
                  "parameters": {
                    "sender_email": "no-reply@example.com"
                  }
                }
              references:
                cluster_id: skycloak_cluster.production.id
                extension_id: local.magic_link_id
        argumentDocs:
            available_version: (String) Latest available version.
            cluster_id: (String) Cluster ID. Immutable.
            extension_id: (String) Catalog extension ID (see the skycloak_extensions data source). Immutable.
            extension_name: (String) Extension display name.
            id: (String) Composite ID cluster_id/extension_id.
            installed_at: (String) Install timestamp (RFC 3339).
            installed_version: (String) Version currently running on the cluster.
            parameters: (Map of String, Sensitive) Parameter values keyed by parameter key. Write-only (sensitive values are never read back). Changing this reinstalls the extension.
            source: (String) Extension source (marketplace, custom).
            status: (String) Installation status.
            upgrade_available: (Boolean) Whether a newer version is available.
        importStatements: []
    skycloak_cluster_maintenance_window:
        subCategory: ""
        description: 'The cluster''s own maintenance window: when Skycloak applies upgrades and other disruptive changes. A singleton per cluster (create == update upsert). Destroying this resource does not leave the cluster without a window: it reverts the cluster to the workspace default window.'
        name: skycloak_cluster_maintenance_window
        title: skycloak_cluster_maintenance_window Resource - skycloak
        examples:
            - name: production
              manifest: |-
                {
                  "cluster_id": "${skycloak_cluster.production.id}",
                  "days_of_week": [
                    2,
                    4
                  ],
                  "enabled": true,
                  "end_local": "05:00",
                  "start_local": "02:00",
                  "timezone": "Europe/Berlin"
                }
              references:
                cluster_id: skycloak_cluster.production.id
        argumentDocs:
            cluster_id: (String) Cluster ID. Immutable.
            days_of_week: (List of Number) Days of week the window applies to (0 = Sunday ... 6 = Saturday).
            enabled: (Boolean) Whether the window is active.
            end_local: (String) Local end time, HH:MM.
            id: (String) Composite ID cluster_id/maintenance-window.
            start_local: (String) Local start time, HH:MM.
            timezone: (String) IANA timezone, e.g. Europe/Berlin.
        importStatements: []
    skycloak_cluster_security:
        subCategory: ""
        description: 'Edge-security configuration for a cluster: IP allow-listing, rate limiting, WAF, geo-blocking, bot management, and CAPTCHA. A singleton per cluster. When the captcha block is omitted, the server''s CAPTCHA settings are left untouched. CAPTCHA hostnames are registered via skycloak_captcha_domain.'
        name: skycloak_cluster_security
        title: skycloak_cluster_security Resource - skycloak
        examples:
            - name: production
              manifest: |-
                {
                  "bot_management": {
                    "challenge_mode": "javascript",
                    "enabled": true,
                    "mode": "block"
                  },
                  "cluster_id": "${skycloak_cluster.production.id}",
                  "geo_blocking": {
                    "countries": [
                      "KP",
                      "RU"
                    ],
                    "enabled": true,
                    "mode": "blocklist"
                  },
                  "ip_access_control": [
                    {
                      "allowed_cidrs": [
                        "203.0.113.0/24"
                      ],
                      "description": "Office network only",
                      "path": "/admin"
                    }
                  ],
                  "rate_limiting": {
                    "enabled": true,
                    "global_rpm": 60000,
                    "per_ip_rpm": 600
                  },
                  "waf": {
                    "enabled": true,
                    "mode": "block",
                    "paranoia_level": 1,
                    "preset": "owasp_top_10"
                  }
                }
              references:
                cluster_id: skycloak_cluster.production.id
        argumentDocs:
            allowed_cidrs: (List of String) CIDR ranges to allow.
            allowed_ips: (List of String) Individual IPs to allow.
            blacklisted_agents: (List of String) User-agent regex patterns to always block.
            bot_management: (Attributes) Bot detection and challenges. (see below for nested schema)
            captcha: (Attributes) Login-flow CAPTCHA challenges. Omit to leave the server's CAPTCHA settings unmanaged. (see below for nested schema)
            categories: (Attributes) Active rule categories (required when preset is custom). (see below for nested schema)
            challenge_mode: (String) none, javascript, or captcha.
            cluster_id: (String) Cluster ID. Immutable.
            cross_site_scripting: (Boolean)
            data_leakage: (Boolean)
            description: (String) Rule description.
            enabled: (Boolean) Whether bot management is enabled.
            enabled_realms: (List of String) Realm IDs where challenges are presented during login.
            endpoint_limits: (Attributes List) Per-path request limits. (see below for nested schema)
            exclusion_paths: (List of String) URL paths exempt from inspection.
            geo_blocking: (Attributes) Country-based access control. (see below for nested schema)
            geo_blocking.countries: (List of String) ISO 3166-1 alpha-2 country codes.
            geo_blocking.enabled: (Boolean) Whether geo-blocking is enabled.
            geo_blocking.mode: (String) allowlist or blocklist.
            global_rpm: (Number) Global requests-per-minute ceiling.
            id: (String) cluster_id/security.
            ip_access_control: (Attributes List) Per-path IP allow rules. (see below for nested schema)
            java_attacks: (Boolean)
            local_file_inclusion: (Boolean)
            mode: (String) block or detect.
            paranoia_level: (Number) Detection sensitivity (1-4).
            path: (String) URL path prefix to restrict.
            paths: (List of String) Restrict the exclusion to these paths.
            per_ip_rpm: (Number) Per-source-IP requests-per-minute ceiling.
            php_injection: (Boolean)
            preset: (String) owasp_top_10, full_crs, or custom.
            protocol_attacks: (Boolean)
            protocol_enforcement: (Boolean)
            rate_limiting: (Attributes) Request-rate ceilings. (see below for nested schema)
            remote_code_execution: (Boolean)
            remote_file_inclusion: (Boolean)
            rpm: (Number) Max requests per minute.
            rule_exclusions: (Attributes List) CRS rules to disable. (see below for nested schema)
            rule_ids: (List of String) OWASP CRS rule IDs to disable.
            session_fixation: (Boolean)
            sql_injection: (Boolean)
            waf: (Attributes) Web application firewall. (see below for nested schema)
            webshell_detection: (Boolean)
            whitelisted_agents: (List of String) User-agent regex patterns to always allow.
        importStatements: []
    skycloak_custom_extension:
        subCategory: ""
        description: Uploads a custom Keycloak extension JAR to the workspace catalog. Changing the JAR contents or version publishes a new version; other metadata updates in place. Install it on a cluster with skycloak_cluster_extension.
        name: skycloak_custom_extension
        title: skycloak_custom_extension Resource - skycloak
        examples:
            - name: magic_link
              manifest: |-
                {
                  "description": "Passwordless email login",
                  "jar": "${path.module}/extensions/magic-link-1.0.0.jar",
                  "keycloak_version": "26",
                  "name": "Magic Link",
                  "parameter_type": "global",
                  "parameters": [
                    {
                      "key": "sender_email",
                      "label": "Sender email",
                      "required": true,
                      "type": "text"
                    },
                    {
                      "is_sensitive": true,
                      "key": "api_key",
                      "label": "Provider API key",
                      "required": true,
                      "type": "password"
                    }
                  ],
                  "version": "1.0.0"
                }
              dependencies:
                skycloak_cluster_extension.magic_link: |-
                    {
                      "cluster_id": "${skycloak_cluster.production.id}",
                      "extension_id": "${skycloak_custom_extension.magic_link.id}",
                      "parameters": {
                        "api_key": "${var.magic_link_api_key}",
                        "sender_email": "no-reply@example.com"
                      }
                    }
        argumentDocs:
            content_sha256: (String) SHA-256 of the uploaded JAR. Recomputed each plan; a change publishes a new version.
            created_at: (String) Creation timestamp (RFC 3339).
            default_value: (String) Default value.
            description: (String) Extension description.
            icon_url: (String) Icon URL.
            id: (String) Extension ID.
            is_sensitive: (Boolean) Whether the value is write-only/secret.
            jar: (String) Path to the extension JAR file.
            key: (String) Unique parameter identifier.
            keycloak_version: (String) Keycloak major version this JAR targets (e.g. 26).
            label: (String) Human-readable label.
            name: (String) Extension name.
            options: (Attributes List) Choices for a dropdown parameter. (see below for nested schema)
            parameter_type: (String) How parameters are supplied to the extension.
            parameters: (Attributes List) Configuration parameter schema exposed when installing the extension. (see below for nested schema)
            repository_url: (String) Source repository URL.
            required: (Boolean) Whether the parameter must be supplied.
            scan_status: (String) Malware scan result.
            source: (String) Extension source (always custom for this resource).
            type: '(String) Field type: text, password, number, checkbox, or dropdown.'
            updated_at: (String) Last update timestamp (RFC 3339).
            value: (String) Option value.
            version: (String) Semantic version (e.g. 1.0.0). Bump it together with the JAR to publish a new version.
        importStatements: []
    skycloak_custom_theme:
        subCategory: ""
        description: Uploads a custom Keycloak theme (ZIP or Keycloakify JAR) to a cluster. Replacing the file contents or theme_types recreates the theme; name, description, and version update in place.
        name: skycloak_custom_theme
        title: skycloak_custom_theme Resource - skycloak
        examples:
            - name: corporate
              manifest: |-
                {
                  "cluster_id": "${skycloak_cluster.production.id}",
                  "name": "corporate",
                  "source": "${path.module}/themes/corporate.zip",
                  "theme_types": [
                    "login",
                    "email"
                  ],
                  "version": "1.2.0"
                }
              references:
                cluster_id: skycloak_cluster.production.id
              dependencies:
                skycloak_theme_assignment.app: |-
                    {
                      "cluster_id": "${skycloak_cluster.production.id}",
                      "login": "${skycloak_custom_theme.corporate.id}",
                      "realm_name": "${skycloak_realm.app.name}"
                    }
        argumentDocs:
            cluster_id: (String) Cluster ID. Immutable.
            content_sha256: (String) SHA-256 of the uploaded file. Recomputed each plan; a change recreates the theme.
            deployed_at: (String) Last successful deployment timestamp (RFC 3339).
            description: (String) Theme description.
            file_size: (Number) Size of the uploaded archive in bytes.
            id: (String) Theme ID.
            name: (String) Theme name.
            source: (String) Path to the theme archive (.zip or .jar).
            status: (String) Deployment status (deployed, deploying, failed, undeploying).
            theme_types: (List of String) Subset of theme types to deploy (login, account, admin, email). Omit to deploy all detected types. Immutable.
            version: (String) Semantic version (e.g. 1.2.3).
        importStatements: []
    skycloak_domain:
        subCategory: ""
        description: A custom domain on a Skycloak cluster. After apply, create the returned dns_records at your DNS provider; verification then completes out of band (refresh to observe verification_status).
        name: skycloak_domain
        title: skycloak_domain Resource - skycloak
        examples:
            - name: app
              manifest: |-
                {
                  "cluster_id": "${skycloak_cluster.production.id}",
                  "domain": "auth.example.com"
                }
              references:
                cluster_id: skycloak_cluster.production.id
        argumentDocs:
            cluster_id: (String) Cluster ID. Immutable.
            cname_target: (String) CNAME target to point the domain at.
            created_at: (String)
            dns_records: (Attributes List) DNS records to create for verification/routing. (see below for nested schema)
            domain: (String) Fully-qualified domain name. Immutable.
            id: (String) Domain ID (UUID).
            is_active: (Boolean) Whether the domain is active.
            name: (String)
            ssl_status: (String) SSL provisioning status.
            subdomain: (String) Optional subdomain. Immutable.
            type: (String)
            updated_at: (String)
            value: (String)
            verification_status: (String) DNS verification status.
        importStatements: []
    skycloak_domain_route:
        subCategory: ""
        description: Maps a realm onto a custom domain.
        name: skycloak_domain_route
        title: skycloak_domain_route Resource - skycloak
        examples:
            - name: app
              manifest: |-
                {
                  "cluster_id": "${skycloak_cluster.production.id}",
                  "cors_allowed_origins": [
                    "https://app.example.com"
                  ],
                  "domain_id": "${skycloak_domain.app.id}",
                  "hide_realm_path": true,
                  "realm": "${skycloak_realm.app.name}"
                }
              references:
                cluster_id: skycloak_cluster.production.id
                domain_id: skycloak_domain.app.id
                realm: skycloak_realm.app.name
        argumentDocs:
            allow_admin_access: (Boolean) Allow admin console access through this route. Defaults to false.
            cluster_id: (String) Cluster ID. Immutable.
            cors_allowed_origins: (List of String) CORS allowed origins for this route.
            created_at: (String)
            domain_id: (String) Custom domain ID. Immutable.
            hide_realm_path: (Boolean) Serve the realm at the domain root (hide /realms/<name>). Set at creation; immutable.
            id: (String) Route ID (UUID).
            realm: (String) Realm to route. Immutable.
            updated_at: (String)
        importStatements: []
    skycloak_email_branding:
        subCategory: ""
        description: Email-template branding for a realm (a singleton; create == update upsert).
        name: skycloak_email_branding
        title: skycloak_email_branding Resource - skycloak
        examples:
            - name: app
              manifest: |-
                {
                  "cluster_id": "${skycloak_cluster.production.id}",
                  "company_url": "https://example.com",
                  "footer_company_name": "Example, Inc.",
                  "footer_text": "You received this email because you have an account with us.",
                  "header_logo_dark_url": "https://cdn.example.com/logo-dark.png",
                  "header_logo_light_url": "https://cdn.example.com/logo-light.png",
                  "internationalization": {
                    "default_locale": "en",
                    "enabled": true,
                    "supported_locales": [
                      "en",
                      "de"
                    ]
                  },
                  "primary_color": "#111827",
                  "realm_name": "${skycloak_realm.app.name}"
                }
              references:
                cluster_id: skycloak_cluster.production.id
                realm_name: skycloak_realm.app.name
        argumentDocs:
            cluster_id: (String) Cluster ID. Immutable.
            company_url: (String) URL linked from the email footer.
            default_locale: (String) Default locale (BCP 47 tag, e.g. en).
            enabled: (Boolean) Whether internationalization is enabled.
            footer_company_name: (String) Company name shown in the email footer.
            footer_text: (String) Free-text shown in the email footer.
            header_logo_dark_url: (String) Logo URL for dark-background email clients.
            header_logo_light_url: (String) Logo URL for light-background email clients.
            id: (String) Composite ID cluster_id/realm_name/email_branding.
            internationalization: (Attributes) Email internationalization settings. (see below for nested schema)
            primary_color: '(String) Primary accent color (hex, e.g. #0ea5e9).'
            realm_name: (String) Realm name. Immutable.
            status: (String) Deployment status (applied, applying, failed).
            supported_locales: (List of String) Locales available to users. Must include default_locale.
        importStatements: []
    skycloak_export:
        subCategory: ""
        description: A one-shot database export job for a cluster. Creating the resource starts the export and waits for it to finish. The archive expires; recreate the resource to produce a fresh export.
        name: skycloak_export
        title: skycloak_export Resource - skycloak
        examples:
            - name: nightly
              manifest: |-
                {
                  "cluster_id": "${skycloak_cluster.production.id}",
                  "encryption_password": "${var.export_password}",
                  "format": "pgdump",
                  "include_credentials": true
                }
              references:
                cluster_id: skycloak_cluster.production.id
                encryption_password: var.export_password
        argumentDocs:
            cluster_id: (String) Cluster ID. Immutable.
            completed_at: (String) Completion timestamp (RFC 3339).
            created_at: (String) Creation timestamp (RFC 3339).
            download_url: (String, Sensitive) Time-limited presigned download URL. Expires; refresh to obtain a new one.
            encryption_password: (String, Sensitive) Password used to encrypt the archive (AES-256-CBC). Required when include_credentials is true. Write-only; never read back. Immutable.
            expires_at: (String) When the archive is deleted from storage (RFC 3339).
            file_size_bytes: (Number) Size of the produced archive in bytes.
            format: '(String) Export format: pgdump or sql. Immutable.'
            id: (String) Export job ID.
            include_credentials: (Boolean) Include the Keycloak credential and related tables. Requires encryption_password. Immutable.
            is_encrypted: (Boolean) Whether the archive is encrypted.
            progress: (Number) Completion percentage (0-100).
            sha256_checksum: (String) SHA-256 checksum of the archive (hex).
            status: (String) Job status (pending, processing, completed, failed).
        importStatements: []
    skycloak_identity_provider:
        subCategory: ""
        description: An identity provider (SSO connection) in a Skycloak realm.
        name: skycloak_identity_provider
        title: skycloak_identity_provider Resource - skycloak
        examples:
            - name: google
              manifest: |-
                {
                  "client_id": "your-google-client-id",
                  "client_secret": "${var.google_client_secret}",
                  "cluster_id": "${skycloak_cluster.production.id}",
                  "config": {
                    "attribute_mappings": {
                      "email": "email"
                    },
                    "button_text": "Sign in with Google",
                    "oidc": {
