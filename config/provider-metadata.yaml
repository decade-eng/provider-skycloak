        argumentDocs:
            background_color: (String) Login page background color (hex).
            button_size: (String) small, medium, or large.
            cluster_id: (String) Cluster ID. Immutable.
            default_locale: (String) Default locale (BCP 47 tag, e.g. en).
            display_style: (String) logo_only, logo_with_text, or text_only.
            enabled: (Boolean) Whether internationalization is enabled.
            favicon_url: (String) URL of the browser favicon.
            font_url: (String) URL of a custom web font.
            forgot_password_enabled: (Boolean) Defaults to the API's value when unset.
            id: (String) Composite ID cluster_id/realm_name/login_branding.
            internationalization: (Attributes) Login page internationalization settings. (see below for nested schema)
            language_selection_mode: (String) automatic_only, automatic_with_selector, hide_selector, or selector_only.
            language_selector_position: (String) form_inside_header, form_inside_left, top_left, top_middle, or top_right.
            language_selector_style: (String) dropdown, flags, or text_labels.
            layout: (String) horizontal or vertical.
            logo_url: (String) URL of the logo displayed on the login page.
            primary_color: '(String) Primary accent color applied to buttons (hex, e.g. #0ea5e9).'
            privacy_policy_url: (String) URL of the privacy policy linked in the footer.
            realm_name: (String) Realm name. Immutable.
            registration_enabled: (Boolean) Defaults to the API's value when unset.
            remember_me_enabled: (Boolean) Defaults to the API's value when unset.
            show_powered_by: (Boolean) Defaults to the API's value when unset.
            sso: (Attributes) Identity-provider button display on the login page. (see below for nested schema)
            status: (String) Deployment status (applied, applying, failed).
            supported_locales: (List of String) Locales available to users. Must include default_locale.
            terms_of_service_url: (String) URL of the terms of service linked in the footer.
        importStatements: []
    skycloak_realm:
        subCategory: ""
        description: A Keycloak realm within a Skycloak cluster.
        name: skycloak_realm
        title: skycloak_realm Resource - skycloak
        examples:
            - name: app
              manifest: |-
                {
                  "cluster_id": "${skycloak_cluster.production.id}",
                  "display_name": "Application Realm",
                  "enabled": true,
                  "login_with_email_allowed": true,
                  "name": "app"
                }
              references:
                cluster_id: skycloak_cluster.production.id
              dependencies:
                skycloak_cluster.production: |-
                    {
                      "location": "eu",
                      "name": "production",
                      "size": "small",
                      "type": "keycloak",
                      "version": "26.1"
                    }
        argumentDocs:
            cluster_id: (String) ID of the cluster the realm belongs to. Immutable.
            created_at: (String) Creation timestamp.
            display_name: (String) Human-readable realm display name.
            duplicate_emails_allowed: (Boolean) Allow duplicate emails across users. Defaults to false.
            enabled: (Boolean) Whether the realm is enabled. Defaults to true.
            id: (String) Composite ID cluster_id/name.
            login_with_email_allowed: (Boolean) Allow login with email. Defaults to false.
            name: (String) Realm name (the Keycloak realm key). Immutable.
            registration_allowed: (Boolean) Allow self-registration. Defaults to false.
            registration_email_as_username: (Boolean) Use email as username on registration. Defaults to false.
            ssl_required: '(String) SSL requirement: external, all, or none. Defaults to external.'
        importStatements: []
    skycloak_realm_export:
        subCategory: ""
        description: A one-shot export of a single realm (configuration, users, and credentials). Creating the resource starts the export and waits for it to finish. The archive is always encrypted and Skycloak deletes it 24 hours after completion, so download_url becomes null once expires_at has passed — recreate the resource to produce a fresh export.
        name: skycloak_realm_export
        title: skycloak_realm_export Resource - skycloak
        examples:
            - name: customer_portal
              manifest: |-
                {
                  "cluster_id": "${skycloak_cluster.production.id}",
                  "encryption_password": "${var.realm_export_password}",
                  "realm": "${skycloak_realm.customer_portal.name}"
                }
              references:
                cluster_id: skycloak_cluster.production.id
                encryption_password: var.realm_export_password
                realm: skycloak_realm.customer_portal.name
        argumentDocs:
            cluster_id: (String) Cluster ID. Immutable.
            completed_at: (String) Completion timestamp (RFC 3339).
            created_at: (String) Creation timestamp (RFC 3339).
            download_url: (String, Sensitive) Time-limited presigned download URL. Null once the archive has expired.
            encryption_password: '(String, Sensitive) Password used to encrypt the archive (AES-256-CBC, PBKDF2), 8-128 characters. Required: every realm export contains credentials. Write-only; never read back, so an imported resource plans a replacement until it is set. Immutable.'
            expires_at: (String) When the archive is deleted from storage, 24h after completion (RFC 3339).
            id: (String) Realm export job ID.
            progress: (Number) Completion percentage (0-100).
            realm: (String) Name of the realm to export. Immutable.
            scope: (String) Export scope. Only full is currently supported. Immutable.
            sha256_checksum: (String) SHA-256 checksum of the encrypted archive (hex).
            source_version: (String) Keycloak version that produced the export. An import target must run this version or newer.
            status: (String) Job status (pending, processing, completed, failed).
        importStatements: []
    skycloak_realm_group:
        subCategory: ""
        description: A realm group. Add users with skycloak_realm_group_membership.
        name: skycloak_realm_group
        title: skycloak_realm_group Resource - skycloak
        examples:
            - name: engineering
              manifest: |-
                {
