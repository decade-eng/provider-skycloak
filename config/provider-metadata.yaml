              manifest: |-
                {
                  "cluster_id": "${skycloak_cluster.production.id}",
                  "login": "${local.corporate_theme}",
                  "realm_name": "${skycloak_realm.app.name}"
                }
              references:
                cluster_id: skycloak_cluster.production.id
                login: local.corporate_theme
                realm_name: skycloak_realm.app.name
        argumentDocs:
            account: (String) Custom theme ID to activate for the account console. Omit to use Keycloak's built-in default.
            admin: (String) Custom theme ID to activate for the admin console. Omit to use Keycloak's built-in default.
            cluster_id: (String) Cluster ID. Immutable.
            email: (String) Custom theme ID to activate for the email templates. Omit to use Keycloak's built-in default.
            id: (String) Composite ID cluster_id/realm_name/theme_assignment.
            login: (String) Custom theme ID to activate for the login page. Omit to use Keycloak's built-in default.
            realm_name: (String) Realm name. Immutable.
        importStatements: []
    skycloak_webhook_subscription:
        subCategory: ""
        description: 'A webhook subscription delivering workspace events to an HTTPS endpoint. signing_secret and authorization_header are write-only: the API never returns them and reads report has_* booleans instead.'
        name: skycloak_webhook_subscription
        title: skycloak_webhook_subscription Resource - skycloak
        examples:
            - name: ops
              manifest: |-
                {
                  "cluster_id": "${skycloak_cluster.production.id}",
                  "event_types": [
                    "LOGIN_ERROR",
                    "USER_DISABLED_BY_PERMANENT_LOCKOUT"
                  ],
                  "name": "ops-alerts",
                  "signing_secret": "${var.webhook_signing_secret}",
                  "source": "keycloak",
                  "url": "https://hooks.example.com/skycloak"
                }
              references:
                cluster_id: skycloak_cluster.production.id
                signing_secret: var.webhook_signing_secret
        argumentDocs:
            authorization_header: (String, Sensitive) Authorization header value sent with each delivery. Write-only; omit to retain the stored value.
            cluster_id: (String) Scope deliveries to one cluster. Omit for all clusters.
            created_at: (String)
            enabled: (Boolean) Whether deliveries are active. Defaults to true.
            event_types: (List of String) Event types to deliver. See the skycloak_webhook_event_types data source for the catalog.
            has_authorization_header: (Boolean) Whether an authorization header is stored.
            has_signing_secret: (Boolean) Whether a signing secret is stored.
            id: (String) Subscription ID (UUID).
            name: (String) Subscription name.
            realm_id: (String) Scope deliveries to one Keycloak realm ID (UUID).
            signing_secret: (String, Sensitive) HMAC secret used to sign deliveries, 32 to 512 characters. Write-only; never read back.
            source: '(String) Event source: keycloak or platform.'
            updated_at: (String)
            url: (String) HTTPS endpoint receiving deliveries.
        importStatements: []
