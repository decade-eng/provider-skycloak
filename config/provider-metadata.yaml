                  "name": "engineering",
                  "realm_name": "${skycloak_realm.app.name}"
                }
              references:
                cluster_id: skycloak_cluster.production.id
                realm_name: skycloak_realm.app.name
            - name: backend
              manifest: |-
                {
                  "cluster_id": "${skycloak_cluster.production.id}",
                  "name": "backend",
                  "parent_id": "${skycloak_realm_group.engineering.id}",
                  "realm_name": "${skycloak_realm.app.name}"
                }
              references:
                cluster_id: skycloak_cluster.production.id
                parent_id: skycloak_realm_group.engineering.id
                realm_name: skycloak_realm.app.name
        argumentDocs:
            cluster_id: (String) Cluster ID. Immutable.
            id: (String) Group ID.
            name: (String) Group name (leaf segment of the path).
            parent_id: (String) Parent group ID for a nested group. Immutable.
            path: (String) Canonical group path.
            realm_name: (String) Realm name. Immutable.
        importStatements: []
    skycloak_realm_group_membership:
        subCategory: ""
        description: Adds a user to a realm group. One resource per (user, group) edge.
        name: skycloak_realm_group_membership
        title: skycloak_realm_group_membership Resource - skycloak
        examples:
            - name: jdoe_eng
              manifest: |-
                {
