apiVersion: skycloak.m.crossplane.io/v1alpha1
kind: ApplicationSecret
metadata:
  annotations:
    meta.upbound.io/example-id: skycloak/v1alpha1/applicationsecret
  labels:
    testing.upbound.io/example-name: web
  name: web
  namespace: crossplane-system
spec:
  forProvider:
    clientId: ${skycloak_application.web.client_id}
    clusterIdSelector:
      matchLabels:
        testing.upbound.io/example-name: production
    realmName: app
    rotateWhen:
      rotated_on: "2026-01-01"
