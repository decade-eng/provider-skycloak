apiVersion: skycloak.m.crossplane.io/v1alpha1
kind: DomainRoute
metadata:
  annotations:
    meta.upbound.io/example-id: skycloak/v1alpha1/domainroute
  labels:
    testing.upbound.io/example-name: app
  name: app
  namespace: crossplane-system
spec:
  forProvider:
    clusterIdSelector:
      matchLabels:
        testing.upbound.io/example-name: production
    corsAllowedOrigins:
    - https://app.example.com
    domainIdSelector:
      matchLabels:
        testing.upbound.io/example-name: app
    hideRealmPath: true
    realm: app
