apiVersion: skycloak.m.crossplane.io/v1alpha1
kind: SMTP
metadata:
  annotations:
    meta.upbound.io/example-id: skycloak/v1alpha1/smtp
  labels:
    testing.upbound.io/example-name: app
  name: app
  namespace: crossplane-system
spec:
  forProvider:
    authType: basic
    clusterIdSelector:
      matchLabels:
        testing.upbound.io/example-name: production
    encryption: starttls
    fromEmail: no-reply@example.com
    fromName: Example App
    host: smtp.example.com
    passwordSecretRef:
      key: example-key
      name: example-secret
    port: 587
    realmName: app
    username: smtp-user
