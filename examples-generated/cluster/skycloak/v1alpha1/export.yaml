apiVersion: skycloak.crossplane.io/v1alpha1
kind: Export
metadata:
  annotations:
    meta.upbound.io/example-id: skycloak/v1alpha1/export
  labels:
    testing.upbound.io/example-name: nightly
  name: nightly
spec:
  forProvider:
    clusterIdSelector:
      matchLabels:
        testing.upbound.io/example-name: production
    encryptionPasswordSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    format: pgdump
    includeCredentials: true
