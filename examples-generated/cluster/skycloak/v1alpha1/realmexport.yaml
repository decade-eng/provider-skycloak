apiVersion: skycloak.crossplane.io/v1alpha1
kind: RealmExport
metadata:
  annotations:
    meta.upbound.io/example-id: skycloak/v1alpha1/realmexport
  labels:
    testing.upbound.io/example-name: customer_portal
  name: customer-portal
spec:
  forProvider:
    clusterIdSelector:
      matchLabels:
        testing.upbound.io/example-name: production
    encryptionPasswordSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    realm: app
